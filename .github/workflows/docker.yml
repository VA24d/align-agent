name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/va24d/align-agent:${{ steps.v.outputs.version }}
            ghcr.io/va24d/align-agent:latest
          labels: |
            org.opencontainers.image.source=https://github.com/VA24d/align-agent
            org.opencontainers.image.description=ALIGN: keep coding agents' views of their files current, and find stale edits in agent trajectories
            org.opencontainers.image.licenses=MIT
